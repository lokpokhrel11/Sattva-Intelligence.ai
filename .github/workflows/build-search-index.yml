name: Build search index
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'archive-search.js'
      - 'scripts/build_search_index.py'
      - '.github/workflows/build-search-index.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate compact index
        run: python scripts/build_search_index.py
      - name: Commit refreshed index if changed
        run: |
          if ! git diff --quiet -- search-index.json || [ ! -f search-index.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add search-index.json
            git diff --cached --quiet || git commit -m "Refresh generated search index"
            git push
          fi

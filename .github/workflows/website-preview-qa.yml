name: Website preview QA

on:
  pull_request:
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - '.github/workflows/website-preview-qa.yml'
      - 'tests/website-qa.mjs'
      - 'sitemap.xml'
      - 'scripts/audit_site.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit internal links, anchors, and sitemap
        run: python3 scripts/audit_site.py
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start isolated local website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/sattva-preview.log 2>&1 &
          echo $! > /tmp/sattva-preview.pid
      - name: Run responsive and PWA browser checks
        run: node tests/website-qa.mjs
      - name: Upload screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-preview-qa
          path: |
            qa-artifacts/
            /tmp/sattva-preview.log
          if-no-files-found: ignore
